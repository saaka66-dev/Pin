<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12665b">
  <title>報修登記</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script defer src="./config.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <header class="site-header"><div class="wrap brand"><span class="brand-icon" aria-hidden="true">＋</span> 報修服務 <span class="brand-note">讓每個問題，都有紀錄。</span></div></header>
  <main class="wrap">
    <section class="intro"><p class="eyebrow">REPAIR REQUEST</p><h1>報修登記</h1><p>發現問題了嗎？留下詳細資訊，讓後續處理更順利。</p></section>
    <section class="panel" aria-labelledby="form-title">
      <div class="section-heading"><h2 id="form-title">新增報修</h2><span>所有欄位皆為必填</span></div>
      <form id="repair-form">
        <fieldset id="form-fields">
          <div class="form-grid">
            <label>報修人<input name="reporter_name" required maxlength="100" autocomplete="name" placeholder="請輸入姓名"></label>
            <label>地點或部門<input name="location" required maxlength="200" placeholder="例如：示範辦公室 3 樓"></label>
            <label>類別<select name="category" required><option value="">請選擇類別</option><option>設備</option><option>網路</option><option>環境</option><option>其他</option></select></label>
            <label>緊急程度<select name="urgency" required><option>低</option><option selected>中</option><option>高</option></select></label>
          </div>
          <label class="description-label">問題說明<textarea name="description" required maxlength="5000" rows="5" placeholder="請描述問題、發生位置與影響情況…"></textarea></label>
          <div class="form-bottom"><p>登記時間與處理狀態由系統自動建立。</p><button id="submit-button" type="submit">送出報修 <span aria-hidden="true">→</span></button></div>
        </fieldset>
      </form>
      <p id="form-message" class="message" role="status" aria-live="polite" hidden></p>
      <noscript>請開啟 JavaScript，才能送出報修與讀取清單。</noscript>
    </section>
    <section class="requests-section" aria-labelledby="list-title">
      <div class="section-heading list-heading"><div><h2 id="list-title">最近報修</h2><p>最近 20 筆紀錄，依登記時間由新到舊排列。</p></div><button type="button" id="refresh-button" class="secondary">重新整理</button></div>
      <div class="urgency-filters" role="group" aria-label="依緊急程度篩選">
        <button type="button" class="filter-button" data-urgency="全部" aria-pressed="true">全部</button>
        <button type="button" class="filter-button" data-urgency="高" aria-pressed="false">高</button>
        <button type="button" class="filter-button" data-urgency="中" aria-pressed="false">中</button>
        <button type="button" class="filter-button" data-urgency="低" aria-pressed="false">低</button>
      </div>
      <p id="filter-message" class="message" role="status" aria-live="polite" hidden></p>
      <p id="list-message" class="message" role="status" aria-live="polite">正在載入報修紀錄…</p>
      <ul id="request-list" class="request-list" aria-label="最近報修紀錄"></ul>
    </section>
  </main>
  <footer class="wrap">報修登記 · 請勿填入密碼或其他機密資訊。</footer>
</body>
</html>
